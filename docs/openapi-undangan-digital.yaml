openapi: 3.0.3
info:
  title: Undangan Digital API
  description: |
    REST API untuk platform Web Undangan Digital Pernikahan.
    Backend: Golang | Database: PostgreSQL (Supabase) | Auth: Supabase JWT
  version: 1.0.0
  contact:
    name: Reza (Backend Engineer)

servers:
  - url: https://api.undangan.app/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local Development

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Verifikasi token dan user profile
  - name: Invitations
    description: CRUD undangan (authenticated)
  - name: Public
    description: Endpoint publik untuk halaman undangan tamu
  - name: RSVP
    description: Manajemen RSVP tamu
  - name: Upload
    description: Presigned URL untuk file upload

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:

  # ── AUTH ──────────────────────────────────
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      description: Verifikasi JWT Supabase dan return user profile. Gunakan ini saat FE pertama load untuk confirm token masih valid.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── INVITATIONS ───────────────────────────
  /invitations:
    get:
      tags: [Invitations]
      summary: List undangan milik user login
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List undangan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/InvitationSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Invitations]
      summary: Buat undangan baru
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Undangan berhasil dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Slug sudah dipakai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: SLUG_TAKEN
                  message: Slug sudah dipakai, pilih slug lain

  /slugs/check:
    get:
      tags: [Invitations]
      summary: Cek ketersediaan slug
      description: |
        Endpoint ringan untuk real-time slug validation di form editor.
        **FE wajib debounce 400–500ms sebelum call endpoint ini.**
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9-]+$"
            minLength: 3
            maxLength: 60
          example: reza-dan-anisa-2025
      responses:
        "200":
          description: Hasil cek slug
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          available:
                            type: boolean
                          slug:
                            type: string
              examples:
                available:
                  summary: Slug tersedia
                  value:
                    success: true
                    data:
                      available: true
                      slug: reza-dan-anisa-2025
                taken:
                  summary: Slug sudah dipakai
                  value:
                    success: true
                    data:
                      available: false
                      slug: reza-dan-anisa-2025
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /invitations/{id}:
    get:
      tags: [Invitations]
      summary: Get undangan by ID (owner only)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: Detail undangan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Invitations]
      summary: Update undangan
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvitationRequest"
      responses:
        "200":
          description: Undangan berhasil diupdate
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Invitations]
      summary: Hapus undangan
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: Undangan berhasil dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── PUBLIC ────────────────────────────────
  /i/{slug}:
    get:
      tags: [Public]
      summary: Get undangan by slug (halaman tamu)
      description: |
        Endpoint publik tanpa auth. Digunakan untuk render halaman undangan yang dibagikan ke tamu.
        Response hanya include data yang perlu ditampilkan ke tamu (no RSVP list, no analytics).
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: reza-dan-anisa-2025
      responses:
        "200":
          description: Data undangan publik
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PublicInvitation"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── RSVP ──────────────────────────────────
  /invitations/{id}/rsvp:
    post:
      tags: [RSVP]
      summary: Submit RSVP (publik, no auth)
      description: Tamu submit kehadiran. Tidak perlu login.
      security: []
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpRequest"
      responses:
        "201":
          description: RSVP berhasil disimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Rsvp"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    get:
      tags: [RSVP]
      summary: List RSVP tamu (owner only)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InvitationId"
        - name: status
          in: query
          schema:
            type: string
            enum: [attending, not_attending, maybe]
          description: Filter by status kehadiran
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: List RSVP
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          rsvps:
                            type: array
                            items:
                              $ref: "#/components/schemas/Rsvp"
                          summary:
                            $ref: "#/components/schemas/RsvpSummary"
                          pagination:
                            $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── UPLOAD ────────────────────────────────
  /upload/presign:
    post:
      tags: [Upload]
      summary: Generate presigned URL untuk upload ke Supabase Storage
      description: |
        FE request presigned URL, lalu upload file langsung ke Supabase Storage.
        File tidak lewat backend Golang — lebih efisien untuk bandwidth.

        **Flow:**
        1. POST /upload/presign → dapat `uploadUrl` dan `publicUrl`
        2. FE PUT file ke `uploadUrl` (direct ke Supabase Storage)
        3. FE simpan `publicUrl` dan kirim ke API saat save invitation data
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileType, category]
              properties:
                fileType:
                  type: string
                  description: MIME type file
                  enum: [image/jpeg, image/png, image/webp]
                  example: image/jpeg
                category:
                  type: string
                  description: Kategori upload, menentukan path di storage
                  enum: [couple_photo, qris]
                  example: couple_photo
      responses:
        "200":
          description: Presigned URL berhasil dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          uploadUrl:
                            type: string
                            description: URL untuk PUT file (expires 5 menit)
                            example: https://xxx.supabase.co/storage/v1/object/sign/uploads/...
                          publicUrl:
                            type: string
                            description: URL publik file setelah diupload
                            example: https://xxx.supabase.co/storage/v1/object/public/uploads/couple_photo/uuid.jpg
                          expiresAt:
                            type: string
                            format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

# ─────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT dari Supabase Auth. Format header → `Authorization: Bearer <token>`

  parameters:
    InvitationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID undangan

  responses:
    BadRequest:
      description: Request tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Data request tidak valid
    Unauthorized:
      description: Token tidak ada atau expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Token tidak valid atau sudah expired
    Forbidden:
      description: Tidak punya akses ke resource ini
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: FORBIDDEN
              message: Kamu tidak punya akses ke undangan ini
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Undangan tidak ditemukan

  schemas:

    # ── BASE RESPONSES ──
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Data request tidak valid

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 50
        total:
          type: integer
          example: 124
        totalPages:
          type: integer
          example: 3

    # ── USER ──
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time

    # ── INVITATION ──
    InvitationConfig:
      type: object
      description: Konfigurasi template dan konten undangan (disimpan sebagai JSON)
      properties:
        templateId:
          type: string
          description: ID template yang dipilih
          example: template-modern-01
        colors:
          type: object
          properties:
            primary:
              type: string
              example: "#7C3AED"
            secondary:
              type: string
              example: "#F5F3FF"
        fonts:
          type: object
          properties:
            heading:
              type: string
              example: Playfair Display
            body:
              type: string
              example: Inter
        couplePhoto:
          type: string
          description: URL foto pasangan
          example: https://xxx.supabase.co/storage/v1/object/public/uploads/couple_photo/uuid.jpg
        music:
          type: object
          properties:
            enabled:
              type: boolean
              default: false
            url:
              type: string
              nullable: true

    InvitationContent:
      type: object
      description: Konten/data undangan yang diisi pasangan
      properties:
        groomName:
          type: string
          example: Reza Mahendra
        brideName:
          type: string
          example: Anisa Putri
        groomParents:
          type: string
          example: Putra dari Bpk. Hendra & Ibu Sari
        brideParents:
          type: string
          example: Putri dari Bpk. Wahyu & Ibu Dewi
        akadDate:
          type: string
          format: date-time
          nullable: true
        akadVenue:
          allOf:
            - $ref: "#/components/schemas/VenueContent"
          nullable: true
          description: Venue akad nikah, opsional — isi hanya jika beda lokasi dari resepsi
        receptionDate:
          type: string
          format: date-time
        venue:
          type: object
          properties:
            name:
              type: string
              example: Gedung Serbaguna Graha Indah
            address:
              type: string
              example: Jl. Sudirman No. 45, Jakarta Selatan
            mapsUrl:
              type: string
              nullable: true
        digitalEnvelope:
          type: object
          description: Info amplop digital
          nullable: true
          properties:
            bankAccounts:
              type: array
              items:
                type: object
                properties:
                  bankName:
                    type: string
                    example: BCA
                  accountNumber:
                    type: string
                    example: "1234567890"
                  accountName:
                    type: string
                    example: Reza Mahendra
            qrisImageUrl:
              type: string
              nullable: true
              example: https://xxx.supabase.co/storage/v1/object/public/uploads/qris/uuid.jpg
        openingMessage:
          type: string
          example: Dengan memohon rahmat dan ridho Allah SWT...

    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        slug:
          type: string
          example: reza-dan-anisa-2025
        status:
          type: string
          enum: [draft, published, archived]
          example: draft
        config:
          $ref: "#/components/schemas/InvitationConfig"
        content:
          $ref: "#/components/schemas/InvitationContent"
        rsvpCount:
          type: integer
          description: Total RSVP masuk
          example: 42
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true

    InvitationSummary:
      type: object
      description: Ringkasan undangan untuk list view di dashboard
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        groomName:
          type: string
        brideName:
          type: string
        receptionDate:
          type: string
          format: date-time
        rsvpCount:
          type: integer
        updatedAt:
          type: string
          format: date-time

    PublicInvitation:
      type: object
      description: Data undangan untuk halaman tamu (no sensitive data)
      properties:
        slug:
          type: string
        config:
          $ref: "#/components/schemas/InvitationConfig"
        content:
          $ref: "#/components/schemas/InvitationContent"

    CreateInvitationRequest:
      type: object
      required: [slug, content]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 3
          maxLength: 60
          example: reza-dan-anisa-2025
        config:
          $ref: "#/components/schemas/InvitationConfig"
        content:
          $ref: "#/components/schemas/InvitationContent"

    UpdateInvitationRequest:
      type: object
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 3
          maxLength: 60
        status:
          type: string
          enum: [draft, published, archived]
        config:
          $ref: "#/components/schemas/InvitationConfig"
        content:
          $ref: "#/components/schemas/InvitationContent"

    # ── RSVP ──
    RsvpRequest:
      type: object
      required: [guestName, status]
      properties:
        guestName:
          type: string
          minLength: 2
          maxLength: 100
          example: Budi Santoso
        status:
          type: string
          enum: [attending, not_attending, maybe]
          example: attending
        guestCount:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: Jumlah tamu yang hadir (hanya relevan kalau status = attending)
        message:
          type: string
          maxLength: 500
          nullable: true
          example: Selamat ya, semoga langgeng!

    Rsvp:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invitationId:
          type: string
          format: uuid
        guestName:
          type: string
        status:
          type: string
          enum: [attending, not_attending, maybe]
        guestCount:
          type: integer
        message:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    RsvpSummary:
      type: object
      properties:
        totalResponses:
          type: integer
          example: 87
        attending:
          type: integer
          example: 65
        notAttending:
          type: integer
          example: 15
        maybe:
          type: integer
          example: 7
        totalGuests:
          type: integer
          description: Total jumlah tamu yang akan hadir (sum dari guestCount)
          example: 110
